<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 迷失在异次元</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .error-box { z-index: 10; }
    .error-code { font-size: 6rem; font-weight: 900; color: #ff0033; line-height: 1; }
    .error-msg { font-size: 1.2rem; color: #a8a8be; margin: 20px 0 30px; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="error-box">
    <div class="error-code">404</div>
    <p class="error-msg">你似乎迷失在了异次元的裂缝中...</p>
    <a href="/" class="btn btn-primary">🚀 返回次元基地</a>
  </div>
</body>
</html>
